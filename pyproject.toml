[project]
name = "cas-concret"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.70.0",
    "joblib>=1.5.3",
    "marimo>=0.22.4",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "openai>=2.30.0",
    "pandas>=3.0.2",
    "plotly>=6.6.0",
    "pydantic>=2.12.5",
    "pydantic-ai-slim>=1.77.0",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.56.0",
    "ty>=0.0.29",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E402"]
"scripts/**" = ["E402"]
